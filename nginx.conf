# Reverse proxy di esempio davanti al container Node.
# In docker-compose montalo su /etc/nginx/nginx.conf.
# I security header (CSP, HSTS, nosniff, …) sono già impostati da server.js:
# qui NON vanno duplicati, altrimenti il browser riceve valori in conflitto.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    server_tokens off;

    # Il proxy comprime già a monte via il middleware `compression`,
    # ma questo copre anche eventuali risposte non compresse.
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/xml;

    # `Connection: upgrade` va inviato SOLO quando il client chiede un upgrade:
    # impostarlo sempre (come faceva la versione precedente) rompe il keep-alive
    # su tutte le richieste normali.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    limit_req_zone $binary_remote_addr zone=contact:10m rate=10r/m;

    server {
        listen 80;
        server_name _;

        # Rinnovo certificati
        location /.well-known/acme-challenge/ { root /var/www/certbot; }

        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name www.nuovacopertura.it nuovacopertura.it;

        ssl_certificate     /etc/letsencrypt/live/nuovacopertura.it/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nuovacopertura.it/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        client_max_body_size 1m;

        # Secondo livello di rate limit, prima ancora di arrivare a Node
        location = /api/contact {
            limit_req zone=contact burst=5 nodelay;
            proxy_pass http://web:3000;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        location / {
            proxy_pass http://web:3000;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}
