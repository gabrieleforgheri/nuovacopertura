# `version:` is obsolete in Compose v2 and is intentionally omitted.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: nuovacopertura-web:latest
    container_name: nuovacopertura_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      SITE_URL: ${SITE_URL:-https://www.nuovacopertura.it}
    # NOTE: deploy.resources.limits only applies in Swarm mode and is silently
    # ignored by `docker compose up`. These are the keys Compose actually honours.
    cpus: 0.5
    mem_limit: 256m
    mem_reservation: 128m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - nuovacopertura_network

networks:
  nuovacopertura_network:
    driver: bridge
    name: nuovacopertura_bridge_net
