version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: nuovacopertura-web:latest
    container_name: nuovacopertura_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - CONTACT_TO=${CONTACT_TO:-}
    networks:
      - nuovacopertura_network
    deploy:
      resources:
        limits:
          cpus: "0.5"       # Restrict to half a CPU core
          memory: 256M      # Restrict memory to 256 MB
        reservations:
          cpus: "0.1"
          memory: 128M

networks:
  nuovacopertura_network:
    driver: bridge
    name: nuovacopertura_bridge_net
